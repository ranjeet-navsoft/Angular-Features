<div class="login-container">
    <mat-card class="login-card">
      <mat-card-header>
        <mat-card-title>Welcome Back</mat-card-title>
        <mat-card-subtitle>Please login to your account</mat-card-subtitle>
      </mat-card-header>
  
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <mat-card-content>
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Email</mat-label>
            <input matInput type="email" formControlName="email" />
            <mat-error *ngIf="isFieldInvalid('email')">Please enter a valid email</mat-error>
          </mat-form-field>
  
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Password</mat-label>
            <input
              matInput
              [type]="showPassword ? 'text' : 'password'"
              formControlName="password"
            />
            <button
              type="button"
              mat-icon-button
              matSuffix
              (click)="togglePassword()"
              [attr.aria-label]="'Toggle password visibility'"
            >
              <mat-icon>{{ showPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
            <mat-error *ngIf="isFieldInvalid('password')">Password is required</mat-error>
          </mat-form-field>
  
          <div class="actions">
            <a mat-button class="forgot-link" href="#">Forgot password?</a>
          </div>
  
          <button mat-raised-button color="primary" class="full-width" type="submit">
            Login
          </button>
        </mat-card-content>
      </form>
  
      <mat-card-footer class="signup-footer">
        <span>Don't have an account?</span>
        <a mat-button color="accent" href="#">Sign up</a>
      </mat-card-footer>
    </mat-card>
  </div>
